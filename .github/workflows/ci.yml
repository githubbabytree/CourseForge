name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check-secrets.mjs
      - run: bash -n scripts/backup.sh scripts/restore.sh scripts/capacity-report.sh scripts/container-smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/ops-scripts.test.mjs
      - run: npm run verify

  container-build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        run: docker compose --env-file infra/.env.example -f infra/compose.yaml config --quiet
      - name: Build main runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.p0
          load: true
          tags: courseforge-main:ci
          cache-from: type=gha,scope=courseforge-main
          cache-to: type=gha,mode=max,scope=courseforge-main
      - name: Verify main runtime image
        run: docker run --rm --entrypoint node courseforge-main:ci -e "import('./apps/api/dist/app.js').then(()=>process.stdout.write('api-runtime-ok\\n'))"
      - name: Build video worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.video-worker
          load: true
          tags: courseforge-video-worker:ci
          cache-from: type=gha,scope=courseforge-video-worker
          cache-to: type=gha,mode=max,scope=courseforge-video-worker
      - name: Verify video worker dependencies and health
        run: |
          docker run --rm --workdir /workspace/packages/video-worker --entrypoint node courseforge-video-worker:ci -e "Promise.all([import('@aws-sdk/client-s3'),import('sharp')]).then(()=>process.stdout.write('video-dependencies-ok\\n'))"
          export VIDEO_WORKER_AUTH_TOKEN="$(printf 'ci-only-%s-%s-0000000000000000' video worker)"
          export VIDEO_WORKER_S3_ACCESS_KEY="$(printf 'ci-%s' access)"
          export VIDEO_WORKER_S3_SECRET_KEY="$(printf 'ci-only-%s' secret)"
          docker run -d --name courseforge-video-ci \
            -e HOST=0.0.0.0 -e PORT=3020 \
            -e VIDEO_WORKER_ENGINE_REVISION=ci \
            -e VIDEO_WORKER_AUTH_TOKEN \
            -e VIDEO_WORKER_IMAGE_DIGEST=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e VIDEO_WORKER_S3_ENDPOINT=http://127.0.0.1:9000 \
            -e VIDEO_WORKER_S3_REGION=us-east-1 -e VIDEO_WORKER_S3_BUCKET=ci-artifacts \
            -e VIDEO_WORKER_S3_ACCESS_KEY -e VIDEO_WORKER_S3_SECRET_KEY \
            courseforge-video-worker:ci
          for attempt in $(seq 1 30); do
            docker exec courseforge-video-ci node -e "fetch('http://127.0.0.1:3020/health').then(async r=>{const v=await r.json();if(!r.ok||v.status!=='ok'||v.service!=='video-worker'||v.engineRevision!=='ci'||v.rendererImageDigest!=='sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa')process.exit(1)}).catch(()=>process.exit(1))" && exit 0
            sleep 1
          done
          docker logs courseforge-video-ci
          exit 1
      - name: Remove test container
        if: always()
        run: docker rm -f courseforge-video-ci >/dev/null 2>&1 || true
